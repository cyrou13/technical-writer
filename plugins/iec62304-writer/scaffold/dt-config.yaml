# Technical-file export configuration.
#
# Read by every writer (item IDs, versioning mode) and by the exporters
# (`/doc-srs`, `/doc-sdd`, `/doc-stp`, `/doc-stdr`, `/doc-str`, `/doc-risk`,
# `/doc-risk-xlsx`, `/doc-use-export`: document control, cover page,
# revision history, lint). Created by `/doc-init`, edited by hand,
# regenerated by nothing: it carries the QMS-side metadata (signatures,
# references, revision history) that does not belong in code.

# -----------------------------------------------------------------------------
# Document identification — the signed cover of a `--release` export.
# -----------------------------------------------------------------------------
document:
  identifier: "[TODO document number in your QMS, e.g. AV-DP-XXX-10-006-SRS]"   # the SRS; the other deliverables take theirs from `documents` below
  title: "[TODO Software Requirements Specification — <product>]"
  short_name: "[TODO short product name]"   # used in default reference labels
  version_label: V01                    # released version of THIS document
  date: YYYY-MM-DD                      # release date of the current version — the DC-1 reference

# -----------------------------------------------------------------------------
# Document identifiers — one QMS document number per deliverable. `srs` repeats
# `document.identifier`. Every exporter prints, and names its file by, ITS OWN
# entry here; its title is `document.title` with the document type substituted
# (an STP is never titled "Software Requirements Specification — … — Software
# Test Plan"). Every `project_references` entry that names one of these
# documents must carry the same identifier (SL-10). The usability triplet
# (UEF / USE / UEF-Annex1) is configured under `usability.document` below.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Submission tree (optional). Without it every exporter writes to docs/export/.
# With it, each deliverable is written straight into its folder of the tree:
# the folder whose number is the document number (…-NN-006-… → "06.…"), or the
# first `folders` entry whose `match` (fnmatch on the file stem) fits.
# Export logs and rendered diagrams go to docs/generated/build/.
# -----------------------------------------------------------------------------
# submission:
#   root: submission/C_HD_XXX
#   folders:                       # only for file names without a document number
#     - match: "*-SRS"
#       folder: "06.SRS"

documents:
  srs: "[TODO e.g. AV-DP-XXX-10-006-SRS]"   # == document.identifier
  sdd: "[TODO e.g. AV-DP-XXX-10-007-SDD]"
  rar: "[TODO e.g. AV-DP-XXX-10-005-RAR]"
  stp: "[TODO e.g. AV-DP-XXX-10-008-STP]"
  stdr: "[TODO e.g. AV-DP-XXX-10-009-STDR]"
  str: "[TODO e.g. AV-DP-XXX-10-010-STR]"

# -----------------------------------------------------------------------------
# Product metadata (also used to build item IDs)
# -----------------------------------------------------------------------------
product:
  suite: "[TODO suite]"                 # e.g. CINA
  application: "[TODO application]"    # e.g. CTP

# -----------------------------------------------------------------------------
# ID format — how new item IDs are minted by the writers.
#
# Available variables:
#   {CAT}      — category prefix (SRS, SDS, TC, RSK, PRSK, THR, USC, URSK, MAP)
#   {SUITE}    — product.suite from above
#   {APP}      — product.application from above
#   {DOMAIN}   — short uppercase domain (e.g. AUTH, ACQ, CAD), chosen by the writer
#   {NNN:03d}  — zero-padded counter (per CAT × DOMAIN)
#
# `default` applies to every category unless overridden by a per-category key.
# Existing items keep their original IDs — format changes only affect NEW IDs.
# -----------------------------------------------------------------------------
id_format:
  default: "{CAT}-{DOMAIN}-{NNN:03d}"
  # 5-segment IDs:
  # default: "{CAT}-{SUITE}-{APP}-{DOMAIN}-{NNN:03d}"
  #
  # Per-category overrides (uncomment as needed):
  # MAP: "{SUITE}-V{VERSION}-{NNN:03d}"

# -----------------------------------------------------------------------------
# Versioning mode (skill items-store).
#   design       pre-first-release: every item pinned to baseline_version, a
#                single creation line in History, everything Draft (DC-4 skipped)
#   maintenance  after the first release: full History discipline, every
#                exported item Approved before a release export
# -----------------------------------------------------------------------------
versioning:
  mode: design
  baseline_version: "1.0.0"

# -----------------------------------------------------------------------------
# Software safety classification (IEC 62304 §4.3). Not inferred from the risk
# file: the class is a signed argument, carried by `record`.
# -----------------------------------------------------------------------------
classification:
  software_safety_class: A              # A | B | C
  status: proposed                      # proposed | approved
  record: null                          # the item carrying the argument, e.g. MAP-CLASS-001
  approved_on: null
  approved_by: null
  # Risk scales rendered in the RAR (§ methodology). A scale is a set of HARM-BASED
  # definitions (ISO 14971:2019 Annex C terms), not a names→integers mapping: a
  # regulatory breach and a neurological injury may not share a severity unless
  # the definition says so. Every RSK / PRSK / URSK is rated on these definitions,
  # and the class argument lists each RSK once with its initial and residual severity.
  severity_definitions:
    Negligible: "[TODO e.g. inconvenience or temporary discomfort; no medical intervention]"
    Minor: "[TODO e.g. temporary injury or impairment not requiring professional medical intervention]"
    Serious: "[TODO e.g. injury or impairment requiring professional medical intervention]"
    Critical: "[TODO e.g. permanent impairment or life-threatening injury]"
    Catastrophic: "[TODO e.g. patient death]"
  probability_definitions:
    Improbable: "[TODO e.g. fewer than 1 in 10^6 uses; not expected in the device lifetime]"
    Remote: "[TODO e.g. 1 in 10^5 to 10^6 uses]"
    Occasional: "[TODO e.g. 1 in 10^4 to 10^5 uses]"
    Probable: "[TODO e.g. 1 in 10^3 to 10^4 uses]"
    Frequent: "[TODO e.g. more than 1 in 10^3 uses]"

# -----------------------------------------------------------------------------
# Requirement ordering — functional areas of the SRS in logical order; domains
# not listed fall back to alphabetical after these. `domain_names` gives the
# human-readable heading of each domain.
# -----------------------------------------------------------------------------
domain_order: []
domain_names: {}

# -----------------------------------------------------------------------------
# Configuration items appendix (SRS export §4). Opt-in: set `example_file` to
# a JSON config file (relative to repo root); its keys are flattened into a
# tracking table (parameter / default / description) and the file is inlined
# as the default configuration. `descriptions` maps a dotted key to a
# one-liner (optional). Remove the block to drop §4.
# -----------------------------------------------------------------------------
# configuration:
#   example_file: config.example.json
#   descriptions:
#     some.nested.key: What this parameter controls.

# -----------------------------------------------------------------------------
# Signatories — cover page of a `--release` export.
# -----------------------------------------------------------------------------
approvals:
  written_by:
    name: "[TODO]"
    role: "[TODO Project Manager / R&D Engineer / ...]"
  verified_by:
    name: "[TODO]"
    role: "[TODO R&D Manager / ...]"
  approved_by:
    name: "[TODO]"
    role: "[TODO Regulatory Manager / Quality Manager / ...]"

# -----------------------------------------------------------------------------
# Revision history — one row per released version of THIS document.
# Versions of individual items are tracked separately in their frontmatter and
# are never printed in an export.
# DC-2: a row with version == document.version_label and date == document.date.
# DC-3: dates strictly increasing, the last one == document.date.
# -----------------------------------------------------------------------------
revision_history:
  - version: V01
    date: YYYY-MM-DD
    parts: All
    reason: Initial creation.

# -----------------------------------------------------------------------------
# Release lint (skill submission-readiness).
#   forbidden_terms  case-insensitive, word-bounded terms that must not appear
#                    in exported text — competitor product and company names
#                    (TL-4). Comparisons live in docs/competitors/, never in an
#                    item.
# -----------------------------------------------------------------------------
lint:
  forbidden_terms: []

# -----------------------------------------------------------------------------
# Project references — cross-document pointers used in §1.3 of the deliverables.
# `id` is the local label used inline (e.g. "[R1]"), `identifier` is the
# external document number, `title` is the human-readable name. An entry that
# names one of the `documents` above MUST carry that document's identifier —
# the lint refuses a mismatch (an STP numbered 10-008 that cites itself as
# 10-006).
# -----------------------------------------------------------------------------
project_references: []
  # - id: R1
  #   identifier: AV-DP-XXX-10-005-RAR      # == documents.rar
  #   title: Risk Analysis Report.
  # - id: R2
  #   identifier: AV-DP-XXX-10-008-STP      # == documents.stp
  #   title: Software Test Plan.
  # - id: R3
  #   identifier: AV-DP-XXX-10-000-PMAP
  #   title: Projects Master Plan.

# -----------------------------------------------------------------------------
# Literature and standard references — the References section of the SRS and
# SDD. Every clinical threshold and every algorithm quoted by an item names its
# source through the item's `references:` id list; an id used by an item and
# absent here, or an entry no item uses, is a lint finding (SL-9).
# -----------------------------------------------------------------------------
references: []
  # - id: DEFUSE3
  #   citation: "Albers GW et al. Thrombectomy for Stroke at 6 to 16 Hours with Selection by Perfusion Imaging. N Engl J Med. 2018;378(8):708-718."
  # - id: OSVD
  #   citation: "Wu O et al. Tracer arrival timing-insensitive technique for estimating flow in MR perfusion-weighted imaging using singular value decomposition with a block-circulant deconvolution matrix. Magn Reson Med. 2003;50(1):164-174."

# -----------------------------------------------------------------------------
# Unresolved anomalies (Enhanced documentation level) — the appendix the
# deliverables export (SDD Appendix C, STR), built by the exporters from:
#   - the known-defects register: the module-level `KNOWN_DEFECTS` literal of
#     `tests/test_known_defects.py` (id, description, owner, target release,
#     risk link, regression test — a test named there must exist in that file);
#   - every TC whose bound run holds a skip or an expected failure
#     (`passed_with_skips`, `passed_with_xfail`, `skipped`);
#   - every risk item at `residual_acceptable: false`;
#   - the open-actions section of the decision record named below, rendered
#     verbatim.
# The appendix is a dated record and is the only exported text exempt from the
# date rule (TL-2). Nothing is written into it by hand. The internal open-points
# register (`## Open questions`, markers) is a different list, exported only
# with `--internal`.
# -----------------------------------------------------------------------------
anomalies:
  open_actions_record: null             # the MAP decision record, e.g. MAP-DECISION-002
  open_actions_section: "Open actions, by owner"   # the `## <n>. <section>` of that record that lists the open actions

# -----------------------------------------------------------------------------
# External resources — optional pointers to QMS-managed files that should be
# inlined into the deliverables instead of the inline `dt-clinical-context.md`
# section.
#
# Each entry maps a narrative anchor → path (relative to repo root). The path
# can point to a .md file produced/maintained outside this repo (Obsidian
# vault, QMS export, etc.).
#
# Resolution order at export time:
#   1. external_resources[<anchor>] exists AND file is readable → inline it
#   2. docs/dt-clinical-context.md has a `## <anchor>` section → inline it
#   3. Neither → a `[TODO]` marker with an author-facing hint in a working /
#      `--internal` export; a `--release` export is refused (TL-1, SL-6)
#
# Available anchors (consumed by /doc-srs, /doc-risk, /doc-sdd, /doc-stp,
# /doc-stdr, /doc-str, /doc-use-export):
#   document-overview, abbreviations, glossary, intended-use,
#   warnings-and-precautions, connected-devices, personnel-and-training,
#   packaging, end-users, characteristics-affecting-safety,
#   general-system-architecture, run-states, architecture-rationale,
#   security-global-view, security-multi-patient-view,
#   security-updateability-view, security-use-case-views,
#   hardware-and-software-requirements, processing-workflow,
#   application-workflow, error-code-standardization, class-diagram,
#   cots-control, test-environment-overview, tests-identification-strategy,
#   tests-schedule, qualification, test-preparation-data,
#   test-preparation-environment, test-preparation-tools,
#   automated-tests-platform, local-tests-platforms, rationale-for-decisions
# -----------------------------------------------------------------------------
external_resources: {}
  # Example — point at a QMS-managed Obsidian note for the system architecture:
  # general-system-architecture: docs/qms/system-architecture.md
  # class-diagram: docs/qms/diagrams/class-diagram.md

# -----------------------------------------------------------------------------
# Rendering options (optional)
# -----------------------------------------------------------------------------
rendering:
  # If set and pandoc is installed, the exporters produce a .docx alongside
  # the .md. Path is relative to the repo root.
  reference_docx: null                  # e.g. "dt-template.docx"

  # If true, the export inlines the full text of `docs/dt-clinical-context.md`
  # in §1 and §2.1. Disable only if you handle framing sections in a separate
  # post-processing step.
  inline_clinical_context: true

# -----------------------------------------------------------------------------
# Bound test run — written by tools/bind_test_results.py. Its `software_version`
# (with `software_version_source`) and `release_evidence_mode` are printed in
# the run metadata of the STDR and the STR with the host, platform, branch,
# dirty flag and tool versions; the SRS, SDD, RAR and STP carry no software
# version. TC statuses: passed | passed_with_skips | passed_with_xfail | failed |
# skipped | not_run | manual_passed | manual_failed — a skip or an expected
# failure inside a case is never folded into `passed`.
# Format spec: see `tools/build_stdr_export.py` docstring or test-results.example.json
# -----------------------------------------------------------------------------
test_results_path: test-results.json

# -----------------------------------------------------------------------------
# Usability — drives /doc-use-export (IEC 62366-1 Usability Engineering File +
# Summative Evaluation + Annex 1 IECEE checklist). The usability exports apply
# the same modes and gate as the other deliverables (`--internal` / `--release`).
# -----------------------------------------------------------------------------
#
# `template` selects the body structure of the UEF §3:
#
#   platform-rich   (default)  — Tabular: use scenarios grouped by `persona`,
#                                use errors grouped by UI surface, mitigation
#                                table cross-ref to SRS-USE-MIT-* and
#                                docs/items/RSK/*.md (sheet "Usability"). Right
#                                for SaaS platforms, multi-role frontends,
#                                anything with > 15 USC items or > 1 persona.
#
#   clinical-narrow             — Narrative: 6-step linear use scenario
#                                (login → visualize → notify → logout). Right
#                                for narrow clinical AI devices with minimal
#                                user interaction and a single persona.
#
# `document.identifier_use`, `document.identifier_uef`,
# `document.identifier_annex1` override the default suffix-based naming. If
# omitted, the script derives them from the global `document.identifier` by
# substituting the SRS/SDD suffix with USE/UEF/UEF-Annex1.
# -----------------------------------------------------------------------------
usability:
  template: platform-rich        # platform-rich | clinical-narrow

  # Optional — override document IDs for the 3 usability deliverables.
  # If omitted, derived from `document.identifier` (SRS → USE / UEF / UEF-Annex1).
  document:
    identifier_uef: null         # e.g. "AV-DP-XXX-10-021-UEF"
    identifier_use: null         # e.g. "AV-DP-XXX-10-021-USE"
    identifier_annex1: null      # e.g. "AV-DP-XXX-10-021-UEF-Annex1"
    version_label: V01           # release label for THIS usability triplet
    date: YYYY-MM-DD

  # Contact information injected into the Annex A questionnaire of the USE
  # document. Defaults fall back to `approvals.written_by` if unset.
  contact:
    name: null
    role: null                   # e.g. "Product Engineer"
    email: null                  # e.g. "support@example.com"

  # Optional — cross-references to a separate Risk Report document for the
  # Annex 1 IECEE checklist (clause 4.1.2 and clauses 5.3 / 5.4 / 5.5).
  # If null, the script falls back to the global `project_references` lookup
  # by document type, then to a [TODO] marker.
  risk_report_ref: null          # e.g. "AV-DP-XXX-10-005-RAR-V03"

# -----------------------------------------------------------------------------
# Where the reference exporters were synced from (scaffold/tools/README.md).
# -----------------------------------------------------------------------------
exporters:
  synced_from: null                     # CINA-CTP repository commit, e.g. "824d7cd"
